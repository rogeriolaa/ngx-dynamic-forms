name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build libraries
        run: npm run build:libs
      - name: Unit tests
        run: |
          npx ng test core
          npx ng test responder
          npx ng test builder
          npx ng test viewer
