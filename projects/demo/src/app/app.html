<header
  class="sticky top-0 z-10 flex flex-wrap items-center gap-3 border-b border-surface-200 bg-surface-0/90 px-4 py-2.5 backdrop-blur dark:border-surface-800 dark:bg-surface-900/90"
>
  <button
    type="button"
    class="flex cursor-pointer items-center gap-2 border-none bg-transparent p-0"
    (click)="goHome()"
  >
    <i class="pi pi-objects-column text-xl text-primary-500"></i>
    <span class="text-base font-semibold">ngx-dynamic-forms</span>
  </button>

  <p-tag value="demo" severity="info" [rounded]="true" />

  <div class="ml-auto flex items-center gap-3">
    <span class="hidden text-xs text-surface-400 sm:inline">Acting as</span>
    <p-select
      [options]="roles"
      optionLabel="label"
      optionValue="value"
      [(ngModel)]="selectedRole"
      [style]="{ width: '14rem' }"
      size="small"
      data-testid="role-switcher"
    />
    <p-button
      [icon]="state.darkMode() ? 'pi pi-sun' : 'pi pi-moon'"
      severity="secondary"
      variant="text"
      size="small"
      [rounded]="true"
      pTooltip="Toggle dark mode"
      data-testid="dark-toggle"
      (onClick)="state.darkMode.set(!state.darkMode())"
    />
  </div>
</header>

<main class="mx-auto w-full max-w-6xl px-4 py-6">
  <router-outlet />
</main>
