<header class="app-header">
  <button type="button" class="app-brand" (click)="goHome()">
    <span class="brand-mark">▦</span>
    <span>ngx-dynamic-forms</span>
  </button>

  <span class="ndf-badge ndf-badge--primary">demo</span>

  <div class="app-header-right">
    <span class="app-header-hint">Acting as</span>
    <select
      class="ndf-select"
      style="width: 13rem"
      [ngModel]="selectedRole"
      (ngModelChange)="state.setRole($event)"
      data-testid="role-switcher"
    >
      @for (role of roles; track role.value) {
        <option [value]="role.value">{{ role.label }}</option>
      }
    </select>

    <label class="accent-picker" title="Override --ndf-primary token">
      Accent
      <input
        type="color"
        [value]="accent()"
        (input)="setAccent($any($event.target).value)"
        data-testid="accent-picker"
      />
    </label>

    <button
      type="button"
      class="icon-btn"
      [title]="state.darkMode() ? 'Switch to light' : 'Switch to dark'"
      data-testid="dark-toggle"
      (click)="state.darkMode.set(!state.darkMode())"
    >
      @if (state.darkMode()) {
        ☀
      } @else {
        ☾
      }
    </button>
  </div>
</header>

<main class="app-main">
  <router-outlet />
</main>
